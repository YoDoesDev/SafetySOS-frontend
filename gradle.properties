#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Thu Oct 01 15:35:59 GMT 2026
org.gradle.caching=true
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
android.enableDexingArtifactTransform=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -XX\:MaxMetaspaceSize\=512m -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US
android.useAndroidX=true
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
