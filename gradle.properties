#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sat Aug 15 13:08:36 GMT 2026
org.gradle.caching=true
org.gradle.daemon.idletimeout=10800000
systemProp.user.language=en
systemProp.user.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -XX\:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US
android.useAndroidX=true
android.enableJetifier=true
org.gradle.workers.max=2
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
