apply plugin: 'com.android.application'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.guardianlabs.safetysos" 
    
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.guardianlabs.safetysos"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1 
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.6' 
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.xerial:sqlite-jdbc:3.40.1.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // Kotlin - Updated to match buildscript version
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.8.20"
    
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    
    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Jetpack Compose - Core & Runtime
    implementation 'androidx.compose.runtime:runtime:1.4.3'
    implementation 'androidx.compose.ui:ui:1.4.3'
    implementation 'androidx.compose.ui:ui-graphics:1.4.3'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.4.3'
    
    // Material3 Design System
    implementation 'androidx.compose.material3:material3:1.1.1'
    
    // Material Icons - Extended set for better icon support
    implementation 'androidx.compose.material:material-icons-extended:1.4.3'
    
    // Activity & Lifecycle
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    
    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    // Debugging & Tooling
    debugImplementation 'androidx.compose.ui:ui-tooling:1.4.3'
    
    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    
    // Security
    implementation 'androidx.security:security-crypto:1.1.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // Splash Screen
    implementation "androidx.core:core-splashscreen:1.0.1"
    
    // Hilt and DI
    implementation "com.google.dagger:hilt-android:2.48.1"
    kapt "com.google.dagger:hilt-compiler:2.48.1"
    implementation "javax.inject:javax.inject:1"

    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    implementation("androidx.room:room-runtime:2.5.2")
    implementation("androidx.room:room-ktx:2.5.2")

    ksp("androidx.room:room-compiler:2.5.2")

    // Firebase Authentication
    implementation platform('com.google.firebase:firebase-bom:33.1.0')
    implementation 'com.google.firebase:firebase-auth'
    
    implementation 'com.google.code.gson:gson:2.10.1'
}
